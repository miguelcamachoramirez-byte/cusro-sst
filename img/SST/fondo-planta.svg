<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3b57"/>
      <stop offset="1" stop-color="#20506f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#1a2730"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd8dc"/>
      <stop offset="1" stop-color="#90a4ae"/>
    </linearGradient>
  </defs>

  <!-- Nave industrial -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Techo con cerchas -->
  <g stroke="#15303f" stroke-width="4" opacity="0.6">
    <path d="M0 90 L1280 90" />
    <path d="M80 90 L160 40 L240 90" fill="none"/>
    <path d="M320 90 L400 40 L480 90" fill="none"/>
    <path d="M560 90 L640 40 L720 90" fill="none"/>
    <path d="M800 90 L880 40 L960 90" fill="none"/>
    <path d="M1040 90 L1120 40 L1200 90" fill="none"/>
  </g>

  <!-- Luces -->
  <g fill="#ffd54f" opacity="0.85">
    <rect x="180" y="96" width="70" height="10" rx="4"/>
    <rect x="600" y="96" width="70" height="10" rx="4"/>
    <rect x="1020" y="96" width="70" height="10" rx="4"/>
  </g>

  <!-- Tuberías -->
  <g stroke="#607d8b" stroke-width="12" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M0 150 L1280 150"/>
    <path d="M0 180 L900 180 L930 210 L1280 210"/>
  </g>

  <!-- Suelo -->
  <rect y="560" width="1280" height="160" fill="url(#floor)"/>
  <g stroke="#0e1a20" stroke-width="2" opacity="0.5">
    <path d="M0 600 L1280 600"/>
    <path d="M160 560 L80 720"/>
    <path d="M420 560 L380 720"/>
    <path d="M700 560 L720 720"/>
    <path d="M980 560 L1060 720"/>
  </g>

  <!-- Franja de seguridad -->
  <g>
    <rect y="552" width="1280" height="12" fill="#f6a81c"/>
    <g fill="#1c1c1c">
      <rect x="0" y="552" width="30" height="12"/>
      <rect x="60" y="552" width="30" height="12"/>
      <rect x="120" y="552" width="30" height="12"/>
      <rect x="180" y="552" width="30" height="12"/>
      <rect x="240" y="552" width="30" height="12"/>
      <rect x="300" y="552" width="30" height="12"/>
      <rect x="360" y="552" width="30" height="12"/>
      <rect x="420" y="552" width="30" height="12"/>
      <rect x="480" y="552" width="30" height="12"/>
      <rect x="540" y="552" width="30" height="12"/>
      <rect x="600" y="552" width="30" height="12"/>
      <rect x="660" y="552" width="30" height="12"/>
      <rect x="720" y="552" width="30" height="12"/>
      <rect x="780" y="552" width="30" height="12"/>
      <rect x="840" y="552" width="30" height="12"/>
      <rect x="900" y="552" width="30" height="12"/>
      <rect x="960" y="552" width="30" height="12"/>
      <rect x="1020" y="552" width="30" height="12"/>
      <rect x="1080" y="552" width="30" height="12"/>
      <rect x="1140" y="552" width="30" height="12"/>
      <rect x="1200" y="552" width="30" height="12"/>
      <rect x="1260" y="552" width="30" height="12"/>
    </g>
  </g>

  <!-- Máquina inyectora (silueta) -->
  <g transform="translate(760 300)">
    <rect x="0" y="60" width="420" height="200" rx="10" fill="url(#metal)"/>
    <rect x="40" y="100" width="160" height="120" rx="8" fill="#78909c"/>
    <rect x="230" y="90" width="150" height="140" rx="8" fill="#607d8b"/>
    <!-- Cañón / husillo -->
    <rect x="200" y="140" width="60" height="30" fill="#455a64"/>
    <!-- Tolva -->
    <path d="M90 100 l40 -50 h40 l-20 50 z" fill="#90a4ae"/>
    <!-- Panel de control -->
    <rect x="380" y="120" width="46" height="80" rx="6" fill="#37474f"/>
    <circle cx="403" cy="140" r="7" fill="#ef5350"/>
    <circle cx="403" cy="162" r="7" fill="#66bb6a"/>
    <rect x="392" y="178" width="22" height="12" rx="3" fill="#ffca28"/>
    <!-- Patas -->
    <rect x="20" y="258" width="20" height="22" fill="#455a64"/>
    <rect x="380" y="258" width="20" height="22" fill="#455a64"/>
  </g>

  <!-- Robot de carga (silueta) -->
  <g transform="translate(120 360)" fill="#f6a81c">
    <rect x="0" y="120" width="120" height="40" rx="6"/>
    <rect x="48" y="20" width="24" height="110"/>
    <path d="M60 20 q80 -10 110 60" fill="none" stroke="#f6a81c" stroke-width="18" stroke-linecap="round"/>
    <rect x="160" y="80" width="30" height="30" rx="4"/>
  </g>
</svg>
